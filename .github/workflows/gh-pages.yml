name: github pages

on:
  workflow_dispatch:
  push:
    branches:
      - main # Set a branch name to trigger deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version: '26.13.0'
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.169.0'
        extended: true

    - name: Setup Dart Sass
      run: |
        curl -fsSL "https://github.com/sass/dart-sass/releases/download/1.108.1/dart-sass-1.108.1-linux-x64.tar.gz" \
          | tar -xz -C "$HOME"
        echo "$HOME/dart-sass" >> "$GITHUB_PATH"
        "$HOME/dart-sass/sass" --version

    - name: Install dependencies
      run: npm ci

    - name: Build site
      run: npm run build

    - name: Deploy github pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        cname: idaas.xlabs.club
